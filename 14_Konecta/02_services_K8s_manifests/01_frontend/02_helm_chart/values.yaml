# Default values for the Konecta frontend service.
# This is a YAML-formatted file.
# Declare variables to be passed into the templates.

replicaCount: 1

image:
  repository: 564956047797.dkr.ecr.us-east-1.amazonaws.com/konecta/konecta-frontend
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: "frontend"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  # annotations: {}

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# The konecta-frontend Next.js app has no metrics/Prometheus endpoint today
# (only /actuator/health, /liveness, /readiness exist) - keep this disabled
# until one is actually implemented, otherwise Prometheus scrapes 404s.
metrics:
  enabled: false
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/actuator/prometheus"

configMap:
  create: true
  name: # if blank this will be generated

app:
  # Public URL of this app, used by the app to build absolute callback URLs
  # (e.g. the Auth service's OAuth redirect must point at
  # <publicUrl>/auth/callback). Not yet read by the app code, but part of
  # its documented env contract (see .env.example in the app repo) -
  # included so it's ready the moment that wiring lands.
  publicUrl: ""

  # Server-side base URLs for each Konecta backend microservice this app
  # calls. Names/keys match the app's real env vars (see .env.example in
  # the konecta-frontend repo) - not a generic "endpoints" map, since the
  # app reads these exact variable names directly via process.env.
  endpoints: {}
    # auth: http://security:80
    # stores: http://store-stock:80
    # cart: http://cart:80
    # checkout: http://checkout:80
    # orders: http://orders:80
    # courier: http://courier:80

## Ingress for load balancer
ingress:
  enabled: false
  # className: ""
  annotations: {}
  #   alb.ingress.kubernetes.io/scheme: internet-facing
  #   alb.ingress.kubernetes.io/target-type: ip
  #   alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/liveness
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  hosts: []
  #  - "chart-example.local"

ingresses: []
  # - name: default
  #   className: ""
  #   hosts: []
  #   annotations: {}
  #   tls: []

opentelemetry:
  enabled: false
  instrumentation: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 2
  maxUnavailable: 1
