apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailpit.fullname" . }}
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 1025
      targetPort: smtp
      protocol: TCP
      name: smtp
    - port: 8025
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mailpit.selectorLabels" . | nindent 4 }}
