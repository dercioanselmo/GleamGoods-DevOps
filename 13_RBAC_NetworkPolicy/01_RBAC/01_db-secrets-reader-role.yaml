# Read-only access to the catalog-db and orders-db Kubernetes Secrets,
# scoped by resourceNames so a binding to this Role cannot read any OTHER
# secret in the namespace - only these two.
#
# ALSO NOTE: this only restricts access via the Kubernetes Secrets API
# (kubectl get/describe secret). It does NOT restrict reading the same
# credential out of a running pod's own process environment via
# `kubectl exec` - see 02_pod-exec-limited-role.yaml for that half.
# And it does not apply at all to any identity holding cluster-admin
# (e.g. via bootstrap_cluster_creator_admin_permissions, or an EKS access
# entry with AmazonEKSClusterAdminPolicy/AmazonEKSAdminPolicy, like the
# GitHub Actions Terraform CI role) - RBAC restrictions never apply to
# cluster-admin, by design.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-secrets-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["catalog-db", "orders-db"]
    verbs: ["get", "list", "watch"]

---
